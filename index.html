<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script se Storyboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg: #17181A;
    --panel: #1F2124;
    --panel-2: #26282C;
    --edge: #34363A;
    --text: #ECE9E3;
    --muted: #9A9C9F;
    --accent: #E8A33D;
    --accent-dim: #6B5326;
    --danger: #D9694F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    line-height:1.5;
    padding: 20px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.88rem;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.82rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field{margin-bottom:18px;}
  input[type=text], input[type=password], textarea{
    width:100%;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:6px;
    color:var(--text);
    padding:11px 12px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.95rem;
  }
  textarea{min-height:130px; resize:vertical;}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .keyhelp{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    margin-top:6px;
  }
  .keyhelp a{color:var(--accent);}
  button{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.95rem;
    font-weight:600;
    border:none;
    border-radius:6px;
    padding:13px 18px;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{
    background:var(--accent);
    color:#1a1305;
  }
  .btn-primary:disabled{
    background:var(--edge);
    color:var(--muted);
    cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--edge);
    margin-top:10px;
  }
  .btn-secondary:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .status{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.85rem;
    color:var(--accent);
    margin:14px 0 0;
    min-height:1.2em;
  }
  .status.error{color:var(--danger);}
  .grid{
    margin-top:26px;
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .slot{
    position:relative;
    aspect-ratio:16/9;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:8px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .slot .num{
    position:absolute;
    top:8px;
    left:8px;
    background:rgba(0,0,0,0.55);
    color:var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    padding:3px 8px;
    border-radius:4px;
    z-index:2;
  }
  .slot .caption{
    position:absolute;
    bottom:0; left:0; right:0;
    background:linear-gradient(transparent, rgba(0,0,0,0.75));
    color:var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    padding:16px 8px 6px;
    z-index:2;
  }
  .slot .loader{
    width:22px; height:22px;
    border:2px solid var(--edge);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  .slot .fail{
    color:var(--muted);
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.75rem;
    text-align:center;
    padding:0 10px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .divider{
    border:none;
    border-top:1px solid var(--edge);
    margin:28px 0 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Script se Storyboard</h1>
  <p class="sub">Apni script paste karein — 12 tasveerein (16:9) khud ban jayengi, phir PDF mein download karein.</p>

  <div class="field">
    <label for="pexelsKey">Pexels API Key</label>
    <input type="password" id="pexelsKey" placeholder="Yahan apni Pexels key paste karein">
    <div class="keyhelp">Key nahi hai? <a href="https://www.pexels.com/api/" target="_blank" rel="noopener">pexels.com/api</a> par free account banayein, "Your API Key" copy karein, yahan paste karein.</div>
  </div>

  <div class="field">
    <label for="script">Script</label>
    <textarea id="script" placeholder="Apni poori script yahan paste karein..."></textarea>
  </div>

  <div class="field">
    <label for="manualScenes">Manual Scenes (Optional — behtar result ke liye)</label>
    <textarea id="manualScenes" placeholder="Agar khud 12 scenes likhna chahte hain to har line mein ek scene likhein (English mein, jaise: sunset over city / man reading book / busy street market). Khali chhod dein to script se khud nikaal lega."></textarea>
  </div>

  <button class="btn-primary" id="genBtn">12 Tasveerein Banao</button>
  <button class="btn-secondary" id="pdfBtn" disabled>PDF Download Karo</button>
  <div class="status" id="status"></div>

  <hr class="divider">

  <div class="grid" id="grid"></div>
</div>

<script>
const genBtn = document.getElementById('genBtn');
const pdfBtn = document.getElementById('pdfBtn');
const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const scriptEl = document.getElementById('script');
const manualEl = document.getElementById('manualScenes');
const keyEl = document.getElementById('pexelsKey');

const STOPWORDS = new Set(['the','a','an','and','or','but','is','are','was','were','be','been','being','to','of','in','on','at','for','with','by','from','as','it','its','this','that','these','those','he','she','they','we','you','i','him','her','them','his','their','my','our','your','not','no','do','does','did','so','if','then','than','into','over','under','out','up','down','about','after','before','when','while','because','just','very','can','will','would','could','should','has','have','had','also','all','some','one','two','more','most','there','here','who','what','which','how','why']);

function splitScriptToPhrases(script, count){
  const words = script.replace(/[\r\n]+/g,' ').split(/\s+/).filter(Boolean);
  if(words.length === 0) return new Array(count).fill('cinematic scene');
  const chunkSize = Math.max(1, Math.ceil(words.length / count));
  const phrases = [];
  for(let i=0; i<count; i++){
    const chunkWords = words.slice(i*chunkSize, (i+1)*chunkSize);
    if(chunkWords.length === 0){
      phrases.push(phrases.length ? phrases[phrases.length-1] : 'cinematic scene');
      continue;
    }
    const candidates = chunkWords
      .map(w => w.replace(/[^a-zA-Z]/g,''))
      .filter(w => w.length > 3 && !STOPWORDS.has(w.toLowerCase()));
    let picked = candidates.length ? candidates : chunkWords.map(w => w.replace(/[^a-zA-Z]/g,'')).filter(Boolean);
    picked = [...new Set(picked.map(w => w.toLowerCase()))].slice(0, 4);
    phrases.push(picked.length ? picked.join(' ') : 'cinematic scene');
  }
  return phrases;
}

function getManualPhrases(){
  const lines = manualEl.value.split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length === 12) return lines;
  return null;
}

let imageDataUrls = new Array(12).fill(null);

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (isError ? ' error' : '');
}

function buildSlots(){
  grid.innerHTML = '';
  for(let i=0;i<12;i++){
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.id = 'slot-' + i;
    slot.innerHTML = '<div class="num">' + (i+1) + ' / 12</div><div class="loader"></div>';
    grid.appendChild(slot);
  }
}

function fillSlot(i, url, caption){
  const slot = document.getElementById('slot-' + i);
  slot.innerHTML =
    '<div class="num">' + (i+1) + ' / 12</div>' +
    '<img src="' + url + '">' +
    '<div class="caption">' + caption + '</div>';
}

function failSlot(i, caption){
  const slot = document.getElementById('slot-' + i);
  slot.innerHTML =
    '<div class="num">' + (i+1) + ' / 12</div>' +
    '<div class="fail">Nahi mili: ' + caption + '</div>';
}

async function fetchPexelsImage(query, apiKey){
  const resp = await fetch('https://api.pexels.com/v1/search?per_page=1&orientation=landscape&query=' + encodeURIComponent(query), {
    headers: { 'Authorization': apiKey }
  });
  if(!resp.ok) throw new Error('pexels-http-' + resp.status);
  const data = await resp.json();
  if(!data.photos || data.photos.length === 0) throw new Error('no-photo');
  return data.photos[0].src.large;
}

async function blobUrlToDataUrl(url){
  const resp = await fetch(url);
  const blob = await resp.blob();
  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

genBtn.addEventListener('click', async () => {
  const script = scriptEl.value.trim();
  const apiKey = keyEl.value.trim();
  if(!script){ setStatus('Pehle apni script likhein.', true); return; }
  if(!apiKey){ setStatus('Pehle Pexels API key daalein.', true); return; }

  genBtn.disabled = true;
  pdfBtn.disabled = true;
  imageDataUrls = new Array(12).fill(null);
  buildSlots();

  const manualPhrases = getManualPhrases();
  const phrases = manualPhrases || splitScriptToPhrases(script, 12);

  setStatus('Tasveerein dhoondi ja rahi hain...');

  let successCount = 0;
  for(let i=0;i<12;i++){
    const phrase = phrases[i];
    try{
      const imgUrl = await fetchPexelsImage(phrase, apiKey);
      const dataUrl = await blobUrlToDataUrl(imgUrl);
      imageDataUrls[i] = dataUrl;
      fillSlot(i, dataUrl, phrase);
      successCount++;
    } catch(err){
      failSlot(i, phrase);
    }
    setStatus((i+1) + ' / 12 tasveerein taiyaar...');
  }

  genBtn.disabled = false;
  if(successCount > 0){
    pdfBtn.disabled = false;
    setStatus(successCount + ' / 12 tasveerein mil gayin. Ab PDF download kar sakte hain.');
  } else {
    setStatus('Koi tasveer nahi mili. Key check karein ya script badal kar dobara koshish karein.', true);
  }
});

pdfBtn.addEventListener('click', () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1280, 720] });
  let first = true;
  imageDataUrls.forEach((dataUrl) => {
    if(!dataUrl) return;
    if(!first) doc.addPage([1280,720], 'landscape');
    first = false;
    doc.addImage(dataUrl, 'JPEG', 0, 0, 1280, 720);
  });
  doc.save('storyboard.pdf');
});
</script>
</body>
</html>
